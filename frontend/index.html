<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" href="data:,"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Conduit</title>
</head>
<body>
<div id="app">
    <header id="titlebar">
        <div class="tb-left">
            <span class="tb-logo">Conduit</span>
        </div>
        <div class="tb-center">
            <input id="quick-connect" type="text" placeholder="user@host:port" spellcheck="false" autocomplete="off"/>
        </div>
        <div class="tb-right">
            <button id="btn-settings" class="tb-btn" title="Settings (Ctrl+,)"></button>
            <div class="tb-win">
                <button id="win-min" class="tb-btn tb-winbtn" title="Minimise"></button>
                <button id="win-max" class="tb-btn tb-winbtn" title="Maximise"></button>
                <button id="win-close" class="tb-btn tb-winbtn tb-close" title="Close"></button>
            </div>
        </div>
    </header>
    <div id="main">
        <aside id="sidebar"></aside>
        <div id="split-sidebar" class="splitter"></div>
        <section id="center">
            <div id="tabbar"></div>
            <div id="terms"><div id="empty" class="hidden"></div></div>
        </section>
        <div id="split-agent" class="splitter"></div>
        <aside id="agent"></aside>
    </div>
</div>
<div id="modal-root"></div>
<div id="toasts"></div>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
