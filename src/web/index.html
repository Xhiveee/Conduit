<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Conduit</title>
</head>
<body>
<div id="app">
    <header id="titlebar">
        <div class="tb-left">
            <span class="tb-brand">
                <span class="tb-mark"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#141416"/><rect x="14" y="16" width="36" height="9" rx="3" fill="#ecebe6"/><rect x="14" y="28" width="36" height="9" rx="3" fill="#b9b6ae"/><rect x="14" y="40" width="23" height="9" rx="3" fill="#8cba9f"/><circle cx="47.5" cy="44.5" r="2.5" fill="#6cc59c"/></svg></span>
                <span class="tb-logo">Conduit</span>
            </span>
        </div>
        <div class="tb-center">
            <input id="quick-connect" type="text" placeholder="user@host:port" spellcheck="false" autocomplete="off"/>
        </div>
        <div class="tb-right">
            <button id="btn-settings" class="tb-btn" data-tip="Settings" data-tip-keys="Ctrl+,"></button>
            <div class="tb-win">
                <button id="win-min" class="tb-btn tb-winbtn" data-tip="Minimise"></button>
                <button id="win-max" class="tb-btn tb-winbtn" data-tip="Maximise" data-tip-keys="Double-click title bar"></button>
                <button id="win-close" class="tb-btn tb-winbtn tb-close" data-tip="Close"></button>
            </div>
        </div>
    </header>
    <div id="main">
        <aside id="sidebar"><div class="boot-skel"><div class="sk-row"></div><div class="sk-row"></div><div class="sk-row"></div></div></aside>
        <div id="split-sidebar" class="splitter"></div>
        <section id="center">
            <div id="tabbar"></div>
            <div id="terms"><div id="empty" class="hidden"></div></div>
        </section>
        <div id="split-agent" class="splitter"></div>
        <aside id="agent"><div class="boot-skel ag-skel"><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div></div></aside>
    </div>
</div>
<div id="modal-root"></div>
<div id="toasts"></div>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
